server:
  port: 8080

spring:
  application:
    name: lab-monitor
  servlet:
    multipart:
      enabled: true
      max-file-size: 100MB
      max-request-size: 100MB

  # 数据库连接
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    # 注意：IP 是你服务器的 IP
    url: jdbc:mysql://192.168.31.130:3306/lab201_monitor?useUnicode=true&characterEncoding=utf-8&serverTimezone=Asia/Shanghai
    username: root
    password: lab201201

  # Redis
  data:
    redis:
      host: 192.168.31.130
      port: 6379
      password: lab201201
      database: 0

  # RabbitMQ
  rabbitmq:
    host: 192.168.31.130
    port: 5672
    username: lab201admin
    password: lab201201

  ai:
    vectorstore:
      milvus:
        client:
          host: 192.168.31.130
          port: 19530
        database-name: default
        collection-name: lab201_collection
        embedding-dimension: 768
        initialize-schema: true
    ollama:
      base-url: http://192.168.31.130:11434
      chat:
        options:
          model: qwen2.5:7b # 确保你服务器下载了这个模型
#          model: deepseek-r1:70b # 确保你服务器下载了这个模型
          temperature: 0.7
      embedding:
        model: nomic-embed-text

# MinIO 配置
minio:
  endpoint: http://192.168.31.130:9000 # 注意：后端走 9000 端口
  access-key: minioadmin
  secret-key: minioadmin
  bucket-name: lab201-files

mybatis-plus:
  configuration:
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl # 打印 SQL 日志


# SpringDoc配置
springdoc:
  api-docs:
    enabled: true
    path: /v3/api-docs
  swagger-ui:
    enabled: true
    path: /swagger-ui.html
  packages-to-scan: com.lab201.monitor

# Knife4j配置
knife4j:
  enable: true
  setting:
    language: zh-CN

