server:
  port: 8080

spring:
  application:
    name: lab-monitor

  # 数据库连接
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    # 注意：IP 是你服务器的 IP
    url: jdbc:mysql://192.168.31.130:3306/lab201_monitor?useUnicode=true&characterEncoding=utf-8&serverTimezone=Asia/Shanghai
    username: root
    password: lab201201

  # Redis
  data:
    redis:
      host: 192.168.31.130
      port: 6379
      password: lab201201
      database: 0

  # RabbitMQ
  rabbitmq:
    host: 192.168.31.130
    port: 5672
    username: lab201admin
    password: lab201201

  ai:
    vectorstore:
      milvus:
        client:
          host: 192.168.31.130
          port: 19530
        database-name: default
        collection-name: lab201_collection
        embedding-dimension: 768
    ollama:
      base-url: http://192.168.31.130:11434
      chat:
        model: qwen2.5:7b # 确保你服务器下载了这个模型
        options:
          temperature: 0.7

mybatis-plus:
  configuration:
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl # 打印 SQL 日志

# application.yml
springdoc:
  swagger-ui:
    path: /swagger-ui.html
    tags-sorter: alpha
    operations-sorter: alpha
  api-docs:
    path: /v3/api-docs
  show-actuator: true

knife4j:
  enable: true  # 开发环境开启，生产环境建议改为 false
  setting:
    language: zh_cn
