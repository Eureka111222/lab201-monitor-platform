version: '3.8'

services:
  # ==========================================
  # 1. MySQL (业务数据库)
  # ==========================================
  mysql:
    image: mysql:8.0
    container_name: lab201_mysql
    restart: always
    # 兼容性设置：使用旧版密码加密方式，防止连接报错
    command: --default-authentication-plugin=mysql_native_password
    environment:
      # 🔒 [安全修改] 请务必修改这里的密码！
      MYSQL_ROOT_PASSWORD: lab201201
      MYSQL_DATABASE: lab201_monitor
      TZ: Asia/Shanghai
    ports:
      - "3306:3306"
    volumes:
      - ./data/mysql:/var/lib/mysql
      - ./sql/init.sql:/docker-entrypoint-initdb.d/init.sql
    networks:
      - lab-net
    healthcheck:
      test: ["CMD", "mysqladmin" ,"ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ==========================================
  # 2. Redis (缓存)
  # ==========================================
  redis:
    image: redis:7.0
    container_name: lab201_redis
    restart: always
    # 🔒 [安全修改] 设置强密码
    command: redis-server --requirepass "lab201201" --appendonly yes
    ports:
      - "6379:6379"
    volumes:
      - ./data/redis:/data
    networks:
      - lab-net

  # ==========================================
  # 3. RabbitMQ (消息队列)
  # ==========================================
  rabbitmq:
    image: rabbitmq:3-management
    container_name: lab201_rabbitmq
    restart: always
    ports:
      - "5672:5672"
      - "15672:15672"
    environment:
      # 🔒 [安全修改] 修改默认账号
      RABBITMQ_DEFAULT_USER: lab201admin
      RABBITMQ_DEFAULT_PASS: lab201201
    networks:
      - lab-net

  # ==========================================
  # 4. 向量数据库组件 (Etcd + MinIO + Milvus)
  # ==========================================
  etcd:
    image: quay.io/coreos/etcd:v3.5.5
    container_name: milvus_etcd
    volumes:
      - ./data/etcd:/etcd
    command: etcd -advertise-client-urls=http://etcd:2379 -listen-client-urls=http://0.0.0.0:2379
    networks:
      - lab-net

  minio:
    image: minio/minio:RELEASE.2023-03-20T20-16-18Z
    container_name: milvus_minio
    environment:
      # 🔒 [安全修改] 修改 MinIO 密钥
      MINIO_ACCESS_KEY: lab201admin
      MINIO_SECRET_KEY: lab201201
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - ./data/minio:/minio_data
    command: minio server /minio_data --console-address ":9001"
    networks:
      - lab-net

  milvus:
    image: milvusdb/milvus:v2.3.4
    container_name: lab201_milvus
    command: ["milvus", "run", "standalone"]
    environment:
      ETCD_ENDPOINTS: etcd:2379
      MINIO_ADDRESS: minio:9000
      # 必须与上面的 MinIO 密码保持一致
      MINIO_ACCESS_KEY: lab201admin
      MINIO_SECRET_KEY: lab201201
    volumes:
      - ./data/milvus:/var/lib/milvus
    ports:
      - "19530:19530"
    networks:
      - lab-net
    depends_on:
      - etcd
      - minio

  # ==========================================
  # 5. Ollama (AI 推理)
  # ==========================================
  ollama:
    image: ollama/ollama:latest
    container_name: lab201_ollama
    restart: always
    ports:
      - "11434:11434"
    volumes:
      - ./data/ollama:/root/.ollama
    networks:
      - lab-net
    # ⚙️ [语法修正] 使用标准 Docker Compose v2 写法调用 GPU
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]

  # ==========================================
  # 6. Nginx (门户)
  # ==========================================
  nginx:
    image: nginx:latest
    container_name: lab201_frontend
    restart: always
    ports:
      - "80:80"
    volumes:
      - ./html:/usr/share/nginx/html
      - ./nginx.conf:/etc/nginx/conf.d/default.conf
    networks:
      - lab-net

networks:
  lab-net:
    driver: bridge